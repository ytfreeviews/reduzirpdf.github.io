<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>ReduzirPDF - Redirecionando...</title>
    <script type="text/javascript">
      // Redirecionamento SPA para GitHub Pages:
      // Transforma o caminho em parâmetro de consulta (?p=...) e redireciona para a raiz
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var targetUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        path + (l.search ? '&' + l.search.slice(1) : '') + l.hash;
      window.location.replace(targetUrl);
    </script>
  </head>
  <body>
    <p>Redirecionando para ReduzirPDF...</p>
  </body>
</html>
