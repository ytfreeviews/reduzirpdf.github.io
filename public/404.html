<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>ReduzirPDF - Redirecionando...</title>
    <script type="text/javascript">
      // Suporte a Single Page Application (SPA) para GitHub Pages
      // Funciona tanto em domínios personalizados (raiz) quanto em subdiretórios de repositório (usuario.github.io/repo)
      var l = window.location;
      var pathSegments = l.pathname.slice(1).split('/').filter(Boolean);
      var isGitHubProject = l.hostname.indexOf('github.io') !== -1 && pathSegments.length > 0;
      
      // Se estiver em usuario.github.io/repo-name/..., preservamos o primeiro segmento (nome do repo)
      var pathSegmentsToKeep = isGitHubProject ? 1 : 0;
      var repoPrefix = pathSegments.slice(0, pathSegmentsToKeep).join('/');
      var appPath = pathSegments.slice(pathSegmentsToKeep).join('/');
      
      var targetUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        (repoPrefix ? '/' + repoPrefix : '') + '/?p=/' +
        appPath + (l.search ? '&' + l.search.slice(1) : '') + l.hash;
        
      window.location.replace(targetUrl);
    </script>
  </head>
  <body>
    <p>Redirecionando para ReduzirPDF...</p>
  </body>
</html>
